<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Choti Diwali - Shaarvyy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .diwali-container {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        .diwali-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, 
                #1a0a2e 0%, 
                #2d1b69 25%, 
                #5b2a86 50%, 
                #ff6b35 75%, 
                #f7931e 100%);
            z-index: -1;
            animation: gradientShift 10s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% {
                filter: hue-rotate(0deg);
            }
            50% {
                filter: hue-rotate(20deg);
            }
        }

        .floating-diya {
            position: fixed;
            font-size: 2rem;
            animation: float 6s ease-in-out infinite;
            opacity: 0.7;
            z-index: 1;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        .sparkle {
            position: fixed;
            font-size: 1.5rem;
            animation: sparkleAnimation 1s ease-out forwards;
            pointer-events: none;
            z-index: 2;
        }

        @keyframes sparkleAnimation {
            0% {
                transform: scale(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: scale(1.5) rotate(180deg);
                opacity: 0;
            }
        }

        .diwali-content {
            position: relative;
            z-index: 10;
            max-width: 800px;
            width: 100%;
        }

        .rangoli-top {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto 30px;
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        .rangoli-circle {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px solid #ffd700;
            border-radius: 50%;
            box-shadow: 0 0 20px #ffd700, inset 0 0 20px #ffd700;
        }

        .rangoli-petals {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .petal {
            position: absolute;
            width: 40px;
            height: 40px;
            background: linear-gradient(45deg, #ff6b35, #f7931e);
            border-radius: 50% 0;
            top: 50%;
            left: 50%;
            transform-origin: 0 0;
            box-shadow: 0 0 10px rgba(255, 107, 53, 0.5);
        }

        .greeting-box {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 50px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            backdrop-filter: blur(10px);
            border: 3px solid #ffd700;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% {
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3), 0 0 20px rgba(255, 215, 0, 0.5);
            }
            50% {
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3), 0 0 40px rgba(255, 215, 0, 0.8);
            }
        }

        .diwali-title {
            font-size: 3rem;
            color: #8b0000;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .title-line {
            display: inline-block;
        }

        .name-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }

        .name-decoration {
            font-size: 2rem;
            animation: bounce 1s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .name {
            font-size: 4rem;
            background: linear-gradient(45deg, #ff6b35, #f7931e, #ffd700, #ff6b35);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientText 3s ease infinite;
            font-weight: bold;
            letter-spacing: 3px;
        }

        @keyframes gradientText {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .message {
            margin: 40px 0;
            padding: 30px;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.1), rgba(255, 107, 53, 0.1));
            border-radius: 20px;
            border: 2px solid rgba(255, 215, 0, 0.3);
        }

        .message-text {
            font-size: 1.3rem;
            color: #2d1b69;
            line-height: 1.8;
            margin: 15px 0;
            font-style: italic;
        }

        .diya-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .diya-emoji {
            font-size: 3rem;
            display: inline-block;
            animation: flicker 1.5s ease-in-out infinite;
        }

        .diya-emoji:nth-child(2) {
            animation-delay: 0.3s;
        }

        .diya-emoji:nth-child(3) {
            animation-delay: 0.6s;
        }

        .diya-emoji:nth-child(4) {
            animation-delay: 0.9s;
        }

        .diya-emoji:nth-child(5) {
            animation-delay: 1.2s;
        }

        @keyframes flicker {
            0%, 100% {
                transform: scale(1);
                filter: brightness(1);
            }
            50% {
                transform: scale(1.1);
                filter: brightness(1.3);
            }
        }

        .fireworks-container {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 5;
        }

        .firework {
            position: absolute;
            font-size: 3rem;
            animation: fireworkAnimation 3s ease-out infinite;
        }

        .firework-1 {
            top: 10%;
            left: 20%;
            animation-delay: 0s;
        }

        .firework-2 {
            top: 20%;
            right: 15%;
            animation-delay: 0.8s;
        }

        .firework-3 {
            bottom: 25%;
            left: 10%;
            animation-delay: 1.6s;
        }

        .firework-4 {
            bottom: 15%;
            right: 20%;
            animation-delay: 2.4s;
        }

        @keyframes fireworkAnimation {
            0% {
                transform: scale(0) rotate(0deg);
                opacity: 0;
            }
            20% {
                transform: scale(1) rotate(180deg);
                opacity: 1;
            }
            80% {
                transform: scale(1.2) rotate(540deg);
                opacity: 1;
            }
            100% {
                transform: scale(0) rotate(720deg);
                opacity: 0;
            }
        }

        .bottom-decoration {
            margin-top: 30px;
        }

        .lotus {
            font-size: 2rem;
            animation: sway 3s ease-in-out infinite;
        }

        @keyframes sway {
            0%, 100% {
                transform: translateX(0) rotate(0deg);
            }
            50% {
                transform: translateX(10px) rotate(5deg);
            }
        }

        .lantern {
            position: fixed;
            font-size: 3rem;
            animation: floatLantern 8s ease-in-out infinite;
            z-index: 3;
        }

        .lantern-1 {
            top: 15%;
            left: 5%;
            animation-delay: 0s;
        }

        .lantern-2 {
            top: 60%;
            right: 8%;
            animation-delay: 2s;
        }

        .lantern-3 {
            bottom: 20%;
            left: 10%;
            animation-delay: 4s;
        }

        @keyframes floatLantern {
            0%, 100% {
                transform: translateY(0) rotate(-5deg);
            }
            50% {
                transform: translateY(-20px) rotate(5deg);
            }
        }

        /* Firecracker Animations */
        .firecracker {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
        }

        .firecracker-spark {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            animation: explode 0.8s ease-out forwards;
        }

        @keyframes explode {
            0% {
                transform: translate(0, 0) scale(1);    
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }

        .rocket {
            position: fixed;
            font-size: 2.5rem;
            animation: rocketLaunch 2s ease-out forwards;
            pointer-events: none;
            z-index: 999;
        }

        @keyframes rocketLaunch {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            70% {
                opacity: 1;
            }
            100% {
                transform: translateY(-500px) rotate(360deg);
                opacity: 0;
            }
        }

        .rocket-trail {
            position: fixed;
            width: 3px;
            height: 20px;
            background: linear-gradient(to bottom, rgba(255, 200, 0, 0.8), transparent);
            pointer-events: none;
            animation: fadeTrail 0.5s ease-out forwards;
            z-index: 998;
        }

        @keyframes fadeTrail {
            to {
                opacity: 0;
                transform: translateY(20px);
            }
        }

        .particle-burst {
            position: fixed;
            pointer-events: none;
            z-index: 1001;
        }

        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: particleFloat 1.5s ease-out forwards;
        }

        @keyframes particleFloat {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--px), var(--py)) scale(0);
                opacity: 0;
            }
        }

        /* Interactive hover effects */
        .greeting-box:hover {
            transform: scale(1.02);
            transition: transform 0.3s ease;
        }

        .name:hover {
            transform: scale(1.1);
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .diya-emoji:hover {
            transform: scale(1.5);
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .interactive-cracker {
            position: fixed;
            font-size: 2rem;
            cursor: pointer;
            animation: wiggle 1s ease-in-out infinite;
            z-index: 20;
            transition: transform 0.2s ease;
        }

        .interactive-cracker:hover {
            transform: scale(1.3);
        }

        @keyframes wiggle {
            0%, 100% {
                transform: rotate(-5deg);
            }
            50% {
                transform: rotate(5deg);
            }
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            pointer-events: none;
            animation: confettiFall 3s linear forwards;
            z-index: 1002;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        .shockwave {
            position: fixed;
            border: 3px solid rgba(255, 215, 0, 0.8);
            border-radius: 50%;
            pointer-events: none;
            animation: shockwaveExpand 0.8s ease-out forwards;
            z-index: 997;
        }

        @keyframes shockwaveExpand {
            0% {
                width: 0;
                height: 0;
                opacity: 1;
            }
            100% {
                width: 300px;
                height: 300px;
                opacity: 0;
            }
        }

        .click-instruction {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.1rem;
            color: #2d1b69;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            animation: bounce 2s ease-in-out infinite;
            z-index: 100;
            font-weight: bold;
            border: 2px solid #ffd700;
        }

        @keyframes fadeInOut {
            0%, 100% {
                opacity: 0.7;
            }
            50% {
                opacity: 1;
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .diwali-title {
                font-size: 2rem;
            }

            .name {
                font-size: 2.5rem;
                letter-spacing: 2px;
            }

            .name-decoration {
                font-size: 1.5rem;
            }

            .message-text {
                font-size: 1.1rem;
            }

            .greeting-box {
                padding: 30px 20px;
            }

            .rangoli-top {
                width: 100px;
                height: 100px;
            }

            .petal {
                width: 30px;
                height: 30px;
            }

            .diya-emoji {
                font-size: 2rem;
            }

            .firework {
                font-size: 2rem;
            }

            .lantern {
                font-size: 2rem;
            }

            .floating-diya {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .diwali-title {
                font-size: 1.5rem;
            }

            .name {
                font-size: 2rem;
                letter-spacing: 1px;
            }

            .name-decoration {
                font-size: 1.2rem;
            }

            .message-text {
                font-size: 1rem;
            }

            .greeting-box {
                padding: 25px 15px;
            }

            .message {
                padding: 20px;
            }

            .diya-row {
                gap: 10px;
            }

            .diya-emoji {
                font-size: 1.5rem;
            }

            .interactive-cracker {
                font-size: 1.5rem;
            }

            .click-instruction {
                font-size: 0.9rem;
                padding: 10px 20px;
                bottom: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="diwali-container">
        <!-- Background with gradient -->
        <div class="diwali-background"></div>
        
        <!-- Floating diyas container -->
        <div id="diyas-container"></div>

        <!-- Sparkles container -->
        <div id="sparkles-container"></div>

        <!-- Main content -->
        <div class="diwali-content">
            <!-- Decorative rangoli pattern -->
            <div class="rangoli-top">
                <div class="rangoli-circle"></div>
                <div class="rangoli-petals">
                    <div class="petal" style="transform: rotate(0deg)"></div>
                    <div class="petal" style="transform: rotate(45deg)"></div>
                    <div class="petal" style="transform: rotate(90deg)"></div>
                    <div class="petal" style="transform: rotate(135deg)"></div>
                    <div class="petal" style="transform: rotate(180deg)"></div>
                    <div class="petal" style="transform: rotate(225deg)"></div>
                    <div class="petal" style="transform: rotate(270deg)"></div>
                    <div class="petal" style="transform: rotate(315deg)"></div>
                </div>
            </div>

            <!-- Main greeting -->
            <div class="greeting-box">
                <h1 class="diwali-title">
                    <span class="title-line">✨ Happy Choti Diwali ✨</span>
                </h1>
                
                <div class="name-container">
                    <div class="name-decoration">🎆</div>
                    <h2 class="name">Shaarvyy</h2>
                    <div class="name-decoration">🎆</div>
                </div>

                <div class="message">
                    <p class="message-text">
                        May this festival of lights bring joy, prosperity, and happiness to your life.
                    </p>
                    <p class="message-text">
                        Let the divine light illuminate your path and fill your days with peace and love.
                    </p>
                </div>

                <div class="diya-row">
                    <span class="diya-emoji">🪔</span>
                    <span class="diya-emoji">🪔</span>
                    <span class="diya-emoji">🪔</span>
                    <span class="diya-emoji">🪔</span>
                    <span class="diya-emoji">🪔</span>
                </div>
            </div>

            <!-- Decorative elements -->
            <div class="fireworks-container">
                <div class="firework firework-1">🎇</div>
                <div class="firework firework-2">🎆</div>
                <div class="firework firework-3">🎇</div>
                <div class="firework firework-4">🎆</div>
            </div>

            <!-- Bottom decoration -->
            <div class="bottom-decoration">
                <div class="lotus">🌸 🌺 🌸 🌺 🌸</div>
            </div>
        </div>

        <!-- Floating lanterns -->
        <div class="lantern lantern-1">🏮</div>
        <div class="lantern lantern-2">🏮</div>
        <div class="lantern lantern-3">🏮</div>

        <!-- Interactive firecrackers -->
        <div class="interactive-cracker" id="cracker1" style="top: 15%; left: 10%;">🧨</div>
        <div class="interactive-cracker" id="cracker2" style="top: 25%; right: 12%;">🧨</div>
        <div class="interactive-cracker" id="cracker3" style="bottom: 20%; left: 15%;">🧨</div>
        <div class="interactive-cracker" id="cracker4" style="bottom: 30%; right: 10%;">🧨</div>

        <!-- Click instruction -->
        <div class="click-instruction">
            🎆 Click anywhere or tap the crackers! 🎇
        </div>
    </div>

    <script>
        // Generate floating diyas
        const diyasContainer = document.getElementById('diyas-container');
        const sparklesContainer = document.getElementById('sparkles-container');

        // Create 15 floating diyas
        for (let i = 0; i < 15; i++) {
            const diya = document.createElement('div');
            diya.className = 'floating-diya';
            diya.textContent = '🪔';
            diya.style.left = Math.random() * 100 + '%';
            diya.style.animationDelay = Math.random() * 3 + 's';
            diya.style.animationDuration = (6 + Math.random() * 3) + 's';
            diyasContainer.appendChild(diya);
        }

        // Generate sparkles periodically
        setInterval(() => {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.textContent = '✨';
            sparkle.style.left = Math.random() * 100 + '%';
            sparkle.style.top = Math.random() * 100 + '%';
            sparklesContainer.appendChild(sparkle);

            setTimeout(() => {
                sparkle.remove();
            }, 1000);
        }, 300);

        // Firecracker explosion effect
        function createFirecracker(x, y) {
            const colors = ['#ff0000', '#ff6b00', '#ffd700', '#00ff00', '#0080ff', '#ff00ff', '#ffffff'];
            const sparkCount = 30;

            // Create shockwave
            const shockwave = document.createElement('div');
            shockwave.className = 'shockwave';
            shockwave.style.left = (x - 150) + 'px';
            shockwave.style.top = (y - 150) + 'px';
            document.body.appendChild(shockwave);

            setTimeout(() => shockwave.remove(), 800);

            // Create sparks
            for (let i = 0; i < sparkCount; i++) {
                const spark = document.createElement('div');
                spark.className = 'firecracker-spark';
                spark.style.left = x + 'px';
                spark.style.top = y + 'px';
                spark.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                const angle = (Math.PI * 2 * i) / sparkCount;
                const velocity = 100 + Math.random() * 100;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;
                
                spark.style.setProperty('--tx', tx + 'px');
                spark.style.setProperty('--ty', ty + 'px');
                
                document.body.appendChild(spark);
                
                setTimeout(() => spark.remove(), 800);
            }

            // Add sound effect (visual feedback)
            createParticleBurst(x, y);
        }

        // Particle burst effect
        function createParticleBurst(x, y) {
            const colors = ['#ffd700', '#ff6b35', '#f7931e', '#ff0066', '#00ffff'];
            const particleCount = 20;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                const angle = Math.random() * Math.PI * 2;
                const distance = 50 + Math.random() * 100;
                const px = Math.cos(angle) * distance;
                const py = Math.sin(angle) * distance;
                
                particle.style.setProperty('--px', px + 'px');
                particle.style.setProperty('--py', py + 'px');
                
                document.body.appendChild(particle);
                
                setTimeout(() => particle.remove(), 1500);
            }
        }

        // Launch rocket
        function launchRocket(x, y) {
            const rocket = document.createElement('div');
            rocket.className = 'rocket';
            rocket.textContent = '🚀';
            rocket.style.left = x + 'px';
            rocket.style.top = y + 'px';
            document.body.appendChild(rocket);

            // Create trail
            let trailInterval = setInterval(() => {
                const trail = document.createElement('div');
                trail.className = 'rocket-trail';
                trail.style.left = x + 'px';
                trail.style.top = rocket.offsetTop + 40 + 'px';
                document.body.appendChild(trail);
                
                setTimeout(() => trail.remove(), 500);
            }, 50);

            setTimeout(() => {
                clearInterval(trailInterval);
                createFirecracker(x, y - 500);
                rocket.remove();
            }, 1400);
        }

        // Confetti shower
        function createConfetti(x, y) {
            const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff', '#ffd700'];
            const confettiCount = 50;

            for (let i = 0; i < confettiCount; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = (x + (Math.random() - 0.5) * 100) + 'px';
                confetti.style.top = y + 'px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = (Math.random() * 0.5) + 's';
                confetti.style.animationDuration = (2 + Math.random() * 2) + 's';
                
                document.body.appendChild(confetti);
                
                setTimeout(() => confetti.remove(), 5000);
            }
        }

        // Random effect selector
        function triggerRandomEffect(x, y) {
            const effects = [createFirecracker, launchRocket, createConfetti];
            const randomEffect = effects[Math.floor(Math.random() * effects.length)];
            randomEffect(x, y);
        }

        // Click anywhere for fireworks
        document.addEventListener('click', (e) => {
            triggerRandomEffect(e.clientX, e.clientY);
        });

        // Interactive crackers
        const crackers = document.querySelectorAll('.interactive-cracker');
        crackers.forEach(cracker => {
            cracker.addEventListener('click', (e) => {
                e.stopPropagation();
                const rect = cracker.getBoundingClientRect();
                const x = rect.left + rect.width / 2;
                const y = rect.top + rect.height / 2;
                
                createFirecracker(x, y);
                cracker.style.display = 'none';
                
                setTimeout(() => {
                    cracker.style.display = 'block';
                }, 3000);
            });
        });

        // Make name interactive
        const nameElement = document.querySelector('.name');
        nameElement.addEventListener('click', (e) => {
            e.stopPropagation();
            const rect = nameElement.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top;
            
            // Create multiple fireworks around the name
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    createFirecracker(
                        x + (Math.random() - 0.5) * 200,
                        y + (Math.random() - 0.5) * 100
                    );
                }, i * 200);
            }
            createConfetti(x, y);
        });

        // Make diyas interactive
        const diyaEmojis = document.querySelectorAll('.diya-emoji');
        diyaEmojis.forEach(diya => {
            diya.addEventListener('click', (e) => {
                e.stopPropagation();
                const rect = diya.getBoundingClientRect();
                const x = rect.left + rect.width / 2;
                const y = rect.top + rect.height / 2;
                
                createParticleBurst(x, y);
                createFirecracker(x, y - 100);
            });
        });

        // Automatic fireworks every 5 seconds
        setInterval(() => {
            const x = Math.random() * window.innerWidth;
            const y = Math.random() * window.innerHeight * 0.7; // Upper 70% of screen
            
            launchRocket(x, window.innerHeight);
        }, 5000);

        // Fade out instruction after 10 seconds
        setTimeout(() => {
            const instruction = document.querySelector('.click-instruction');
            if (instruction) {
                instruction.style.transition = 'opacity 1s ease';
                instruction.style.opacity = '0';
                setTimeout(() => instruction.remove(), 1000);
            }
        }, 10000);
    </script>
</body>
</html>
